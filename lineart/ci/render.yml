# 完整渲染：整片（或 range 指定的一段）按帧数切成 N 段，N 台 GitHub 机器并行渲染（Playwright 的无界面 Chrome 逐帧截图），
# 每段压成 MP4，最后拼接、解密原曲配上音轨（音乐比画面短就补静音；有 render/music_tail.txt 就按它做结尾回声），产出成片（Actions → 这次运行 → Artifacts → video）。
# 用法：复制到项目的 .github/workflows/render.yml。来自《把回忆拼好给你》线稿版（pinhui-lineart-mv），那次用它出过成片。
# 手动触发：gh workflow run render.yml [-f range=23:27] [-f segments=20]
# 原曲加密放 assets/music.m4a.gpg（或 music.mp3.gpg），口令是仓库 Secret MUSIC_KEY。
name: render

on:
  workflow_dispatch:
    inputs:
      range:
        description: 渲染哪一段（秒，a:b），留空 = 整片
        default: ''
      segments:
        description: 分几段并行（≤ 20）
        default: '20'
  push:   # 只为了让 GitHub 登记这个流程；push 时各个任务都跳过
    paths: ['.github/workflows/render.yml']

concurrency: render

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      segs: ${{ steps.p.outputs.segs }}
      a: ${{ steps.p.outputs.a }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          node -e '
            const src = require("fs").readFileSync("js/config.js", "utf8"), DUR = +src.match(/DUR = ([\d.]+)/)[1], fps = 30;
            const r = (process.env.RANGE || "").trim(), n = Math.max(1, Math.min(20, +process.env.SEGS || 20));
            const [a, b] = r ? r.split(":").map(Number) : [0, DUR];
            const f0 = Math.round(a * fps), f1 = Math.min(Math.round(DUR * fps), Math.round(b * fps)), segs = [];
            for (let i = 0; i < n; i++) { const s = f0 + Math.floor(i * (f1 - f0) / n), e = f0 + Math.floor((i + 1) * (f1 - f0) / n); if (e > s) segs.push({ i, s, e }); }
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `segs=${JSON.stringify(segs)}\na=${a}\n`);
            console.log(`frames ${f0}..${f1 - 1} in ${segs.length} segments`, segs);
          '
        env: { RANGE: '${{ inputs.range }}', SEGS: '${{ inputs.segments }}' }

  frames:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seg: ${{ fromJSON(needs.plan.outputs.segs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Chrome（Playwright 无界面版）+ ffmpeg
        run: |
          npx playwright-core install --with-deps --only-shell chromium
          sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: render frames ${{ matrix.seg.s }}..${{ matrix.seg.e }}
        run: |
          A=$(node -e "console.log(${{ matrix.seg.s }} / 30)"); B=$(node -e "console.log(${{ matrix.seg.e }} / 30)")
          node render/render.mjs --from $A --to $B --workers 2 --out seg_$(printf %02d ${{ matrix.seg.i }}).mp4
          ls -la seg_*.mp4
      - uses: actions/upload-artifact@v4
        with: { name: 'seg-${{ matrix.seg.i }}', path: 'seg_*.mp4', retention-days: 3 }

  video:
    needs: [plan, frames]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - uses: actions/download-artifact@v4
        with: { pattern: 'seg-*', merge-multiple: true, path: segs }
      - name: join + music
        env: { MUSIC_KEY: '${{ secrets.MUSIC_KEY }}' }
        run: |
          ls segs | sort | sed 's#^#file segs/#' > list.txt; cat list.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i list.txt -c copy video_silent.mp4
          printf '%s' "$MUSIC_KEY" > key.txt
          G=$(ls assets/music.*.gpg | head -1); M=$(basename "$G" .gpg)
          gpg --batch --quiet --passphrase-file key.txt -o "$M" -d "$G" && rm key.txt
          A=${{ needs.plan.outputs.a }}
          # 结尾：有 render/music_tail.txt 就做回声渐出（和本机 render.mjs 同一份），否则补静音；按整首歌的时间处理，再剪掉 range 的开头
          if [ -f render/music_tail.txt ]; then T="$(tr -d '\n' < render/music_tail.txt)"; else T='[1:a]apad[full]'; fi
          F="$T;[full]atrim=start=$A,asetpts=PTS-STARTPTS[a]"
          ffmpeg -y -loglevel error -i video_silent.mp4 -i "$M" -filter_complex "$F" -map 0:v -map '[a]' -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart lineart_mv.mp4
          rm "$M"
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,r_frame_rate -of compact lineart_mv.mp4
      - uses: actions/upload-artifact@v4
        with: { name: video, path: 'lineart_mv.mp4', retention-days: 14 }
