<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>漫画画风 · 示例</title>
<style>
  @font-face { font-family: 'Caption'; font-display: block; src: url(fonts/caption.otf) format('opentype'); }
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); height: auto; background: #F6F3EB; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="11" step="0.0333" value="0"><span id="tt">loading…</span></div>
</main>
<!-- engine: a 2D-canvas manga kit (no WebGL) -->
<script src="src/config.js"></script>
<script src="src/ink.js"></script>
<script src="src/mfx.js"></script>
<script src="src/frame.js"></script>
<script src="src/timeline.js"></script>
<script src="src/music.js"></script>
<script src="src/karaoke.js"></script>
<!-- people -->
<script src="src/face.js"></script>
<script src="src/hair.js"></script>
<script src="src/hair2.js"></script>
<script src="src/cast.js"></script>
<script src="src/body.js"></script>
<script src="src/outfit.js"></script>
<!-- the town, the props -->
<script src="src/props.js"></script>
<script src="src/world.js"></script>
<!-- model sheets -->
<script src="src/sheet.js"></script>
<!-- the video -->
<script src="src/scenes/common.js"></script>
<script src="src/scenes/demo.js"></script>
<script>
  const q = new URLSearchParams(location.search).get('loop'); if (q && LOOPS[q]) window.LOOP = LOOPS[q];
</script>
</body>
</html>
